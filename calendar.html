  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

  <script>(function(){try{var t=localStorage.getItem("finedu-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("finedu-auth");if(a==="yes"||a==="no")document.documentElement.setAttribute("data-auth",a);}catch(_){}})();</script>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/calendar.css" />
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="/"><span>FinEdu</span></a>
      <button class="site-nav__toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primary-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="7"  x2="21" y2="7"  />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="주요 메뉴">
        <a class="site-nav__link" href="/">홈</a>
        <a class="site-nav__link" href="/learn.html" data-auth-required>학습</a>
        <a class="site-nav__link" href="/closet.html" data-auth-required>옷장</a>
        <a class="site-nav__link" href="/market.html" data-auth-required>마켓</a>
        <a class="site-nav__link" href="/friends.html" data-auth-required>친구</a>
        <a class="site-nav__link" href="/league.html" data-auth-required>리그</a>
        <a class="site-nav__link" href="/profile.html" data-auth-required>프로필</a>
        <div class="site-nav__more">
          <button class="site-nav__more-btn" type="button" aria-haspopup="true" aria-expanded="false">더보기 ▾</button>
          <div class="site-nav__more-menu" role="menu" hidden>
            <a href="/calendar.html" role="menuitem" data-auth-required>캘린더</a>
            <a href="/scraps.html" role="menuitem" data-auth-required>즐겨찾기</a>
            <a href="/terms.html" role="menuitem">용어사전</a>
            <a href="/qna.html" role="menuitem">Q&amp;A 게시판</a>
            <a href="/reviews.html" role="menuitem">사용자 리뷰</a>
            <hr/>
            <a href="/about.html" role="menuitem">소개</a>
            <a href="/how-it-works.html" role="menuitem">진행 방식</a>
            <a href="/faq.html" role="menuitem">FAQ</a>
          </div>
        </div>
        <div class="site-nav__actions">
          <a class="btn btn--secondary btn--sm" href="/login.html">로그인</a>
          <a class="btn btn--sm" href="/signup.html">무료 시작</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container cal-shell">
    <header class="cal-head">
      <div>
        <h1 class="cal-head__title">📅 학습 캘린더</h1>
        <p class="cal-head__sub" id="cal-stats">…</p>
      </div>
      <div class="cal-nav">
        <button class="btn btn--secondary btn--sm" id="cal-prev" type="button" aria-label="이전 달">←</button>
        <h2 class="cal-nav__label" id="cal-label">…</h2>
        <button class="btn btn--secondary btn--sm" id="cal-next" type="button" aria-label="다음 달">→</button>
        <button class="btn btn--secondary btn--sm" id="cal-today" type="button">오늘</button>
        <button class="btn btn--sm" id="cal-add" type="button">+ 일정 추가</button>
      </div>
    </header>

    <div class="cal-legend">
      <span class="cal-legend__item"><span class="cal-dot cal-dot--done"></span> 학습한 날</span>
      <span class="cal-legend__item"><span class="cal-dot cal-dot--event"></span> 내 일정</span>
      <span class="cal-legend__item"><span class="cal-dot cal-dot--today"></span> 오늘</span>
      <label class="cal-legend__item cal-friends-toggle">
        <input type="checkbox" id="cal-show-friends" />
        <span class="cal-dot cal-dot--friends"></span>
        친구 학습 표시
      </label>
    </div>

    <section class="cal-grid-wrap">
      <div class="cal-dow">
        <div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div>
      </div>
      <div id="cal-grid" class="cal-grid"></div>
    </section>

    <!-- 선택된 날 패널 -->
    <section id="cal-detail" class="cal-detail" hidden>
      <header class="cal-detail__head">
        <h2 id="cal-detail-title">…</h2>
        <button class="cal-detail__close" id="cal-detail-close" type="button" aria-label="닫기">✕</button>
      </header>
      <div id="cal-detail-body" class="cal-detail__body"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-logo" href="/"><span>FinEdu</span></a>
      <p>경제와 금융을 게임처럼 배우는 곳.</p>
      <nav class="site-footer__links" aria-label="페이지 메뉴">
        <a href="/about.html">소개</a>
        <a href="/how-it-works.html">진행 방식</a>
        <a href="/faq.html">FAQ</a>
        <a href="/terms.html">용어사전</a>
      </nav>
      <p class="site-footer__credit">© 2026 FinEdu</p>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/calendar.js"></script>
</body>
</html>

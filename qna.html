  <main class="container qna-shell">
    <header class="qna-head">
      <span class="qna-head__eyebrow">학습 Q&amp;A</span>

          <input id="qna-search" class="input" type="search" placeholder="질문 / 본문 검색…" />
        </div>
        <div class="qna-toolbar__sort">
          <label for="qna-sort">정렬</label>
          <select id="qna-sort" class="select">
            <option value="recent">최신순</option>
            <option value="reply_count">답글 많은 순</option>
          </select>
        </div>
        <button id="qna-new-btn" class="btn btn--sm" type="button">+ 새 질문</button>
      </div>
      <div id="qna-cats" class="qna-cats" role="tablist"></div>
    </section>

    <p id="qna-count" class="qna-count" aria-live="polite"></p>
    <section id="qna-list" class="qna-list"></section>
    <div id="qna-pagination"></div>

<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="/">
                <span>FinEdu</span>
      </a>

      <button class="site-nav__toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primary-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="7"  x2="21" y2="7"  />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="주요 메뉴">
        <a class="site-nav__link" href="/">홈</a>
        <a class="site-nav__link" href="/learn.html">학습</a>
        <a class="site-nav__link" href="/closet.html">옷장</a>
        <a class="site-nav__link" href="/market.html">마켓</a>
        <a class="site-nav__link" href="/friends.html">친구</a>
        <a class="site-nav__link" href="/league.html">리그</a>
        <a class="site-nav__link" href="/profile.html">프로필</a>
        <div class="site-nav__more">
          <button class="site-nav__more-btn" type="button" aria-haspopup="true" aria-expanded="false">더보기 ▾</button>
          <div class="site-nav__more-menu" role="menu" hidden>
            <a href="/calendar.html" role="menuitem">캘린더</a>
            <a href="/scraps.html" role="menuitem">즐겨찾기</a>
            <a href="/terms.html" role="menuitem">용어사전</a>
            <a href="/qna.html" role="menuitem">Q&amp;A 게시판</a>
            <a href="/reviews.html" role="menuitem">사용자 리뷰</a>
            <hr/>
            <a href="/about.html" role="menuitem">소개</a>
            <a href="/how-it-works.html" role="menuitem">진행 방식</a>
            <a href="/faq.html" role="menuitem">FAQ</a>
          </div>
        </div>
        <div class="site-nav__actions">
          <a class="btn btn--secondary btn--sm" href="/login.html">로그인</a>
          <a class="btn btn--sm" href="/signup.html">무료 시작</a>
        </div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="profile-shell">

      <!-- 좌측: 아바타 + 이름 -->
      <aside class="profile-aside">
        <div id="aside-mascot" class="profile-aside__mascot" aria-hidden="true"></div>
        <h1 id="aside-name" class="profile-aside__name">…</h1>
        <p id="aside-handle" class="profile-aside__handle"></p>
        <p id="aside-joined" class="profile-aside__joined"></p>
        <div class="profile-aside__actions">
          <a class="btn btn--secondary btn--sm" href="/closet.html">옷장 가기</a>
          <a class="btn btn--sm" href="/learn.html">학습 계속</a>
        </div>
        <div class="profile-aside__links">
          <a href="/calendar.html">캘린더</a>
          <a href="/scraps.html">즐겨찾기</a>
          <a href="/settings.html">⚙ 계정 설정</a>
        </div>
      </aside>

      <!-- 우측: 통계 + 차트 + 활동 -->
      <section class="profile-main">

        <!-- 통계 그리드 -->
        <div class="stat-grid">
          <div class="stat-card stat-card--xp">
            <div class="stat-card__label">XP</div>
            <div class="stat-card__num"><span id="stat-xp">0</span></div>
          </div>
          <div class="stat-card stat-card--coins">
            <div class="stat-card__label">코인</div>
            <div class="stat-card__num"><span id="stat-coins">0</span></div>
          </div>
          <div class="stat-card stat-card--streak">
            <div class="stat-card__label">스트릭</div>
            <div class="stat-card__num">D-<span id="stat-streak">0</span></div>
          </div>
          <div class="stat-card stat-card--done">
            <div class="stat-card__label">완료 레슨</div>
            <div class="stat-card__num">
              <span id="stat-done">0</span>
              <small id="stat-done-total"></small>
            </div>
          </div>
          <div class="stat-card stat-card--friend">
            <div class="stat-card__label">친구</div>
            <div class="stat-card__num"><span id="stat-friend">0</span></div>
          </div>
          <div class="stat-card stat-card--owned">
            <div class="stat-card__label">보유 아이템</div>
            <div class="stat-card__num"><span id="stat-owned">0</span></div>
          </div>
        </div>

        <!-- 주간 XP 차트 -->
        <section class="profile-section">
          <header class="profile-section__head">
            <h2 class="profile-section__title">지난 7일 XP</h2>
            <span class="profile-section__sub">레슨 완료로 얻은 XP 기준</span>
          </header>
          <div id="weekly-chart" class="weekly-chart"></div>
        </section>

        <!-- 최근 활동 -->
        <section class="profile-section">
          <header class="profile-section__head">
            <h2 class="profile-section__title">최근 활동</h2>
            <span class="profile-section__sub">최근 완료한 레슨</span>
          </header>
          <div id="recent-list" class="recent-list"></div>
        </section>

      </section>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <nav class="site-footer__links" aria-label="페이지 메뉴">
        <a href="/about.html">소개</a>

      </nav>
      <p class="site-footer__credit">© 2026 FinEdu</p>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/profile.js"></script>
</body>
</html>

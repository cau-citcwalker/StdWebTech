<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4154f1" />
  <title>친구 프로필 · FinEdu</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="alternate icon" href="assets/img/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <script>(function(){try{var t=localStorage.getItem("finedu-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark");}catch(_){}})();</script>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/friends.css" />
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="/">
                <span>FinEdu</span>
      </a>

      <button class="site-nav__toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primary-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="7"  x2="21" y2="7"  />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="주요 메뉴">
        <a class="site-nav__link" href="/">홈</a>
        <a class="site-nav__link" href="/learn.html">학습</a>
        <a class="site-nav__link" href="/closet.html">옷장</a>
        <a class="site-nav__link" href="/market.html">마켓</a>
        <a class="site-nav__link" href="/friends.html">친구</a>
        <a class="site-nav__link" href="/profile.html">프로필</a>
        <a class="site-nav__link" href="/league.html">리그</a>
        <a class="site-nav__link" href="/terms.html">용어사전</a>
        <div class="site-nav__actions"></div>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="profile-shell">
      <aside class="profile-stage">
        <div id="profile-mascot" class="profile-stage__mascot" aria-hidden="true"></div>
        <h1 id="profile-name" class="profile-stage__name">…</h1>
        <p id="profile-handle" class="profile-stage__handle"></p>
        <div class="profile-stats">
          <div class="profile-stat">
            <div class="profile-stat__num" id="profile-xp">0</div>
            <div class="profile-stat__label">XP</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat__num" id="profile-streak">D-0</div>
            <div class="profile-stat__label">스트릭</div>
          </div>
          <div class="profile-stat">
            <div class="profile-stat__num" id="profile-joined">—</div>
            <div class="profile-stat__label">가입일</div>
          </div>
        </div>
      </aside>

      <section class="profile-main">
        <p style="color: var(--color-text-soft);">친구가 어떤 옷을 입고 있는지 구경해 보세요. 자기 자신의 프로필은 옷장에서 직접 꾸미면 즉시 반영돼요.</p>

        <div id="profile-self-note" hidden style="margin-top: 24px; padding: 16px; background: var(--color-brand-bg); border-radius: 12px;">
          이건 본인 프로필이에요. 옷장(<a href="/closet.html">/closet</a>)에서 변경하면 친구에게도 이렇게 보입니다.
        </div>

        <div class="profile-actions" style="margin-top: 24px;">
          <a class="btn btn--secondary" href="/friends.html">← 친구 목록</a>
          <button id="profile-remove" class="btn btn--ghost btn--sm" type="button" style="color: var(--color-accent-red-dark);">친구 끊기</button>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <nav class="site-footer__links" aria-label="페이지 메뉴">
        <a href="/about.html">소개</a>
        <a href="/how-it-works.html">진행 방식</a>
        <a href="/faq.html">FAQ</a>
        <a href="/terms.html">용어사전</a>
      </nav>
      <p class="site-footer__credit">© 2026 FinEdu</p>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/friend.js"></script>
</body>
</html>

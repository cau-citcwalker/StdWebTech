<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4154f1" />
  <title>로그인 · FinEdu</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="alternate icon" href="assets/img/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <script>(function(){try{var t=localStorage.getItem("finedu-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark");var a=localStorage.getItem("finedu-auth");if(a==="yes"||a==="no")document.documentElement.setAttribute("data-auth",a);}catch(_){}})();</script>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

  <header class="auth-header">
    <div class="container auth-header__inner">
      <a class="site-logo" href="/">
                <span>FinEdu</span>
      </a>
      <span class="auth-header__alt">
        처음이신가요? <a href="/signup.html">가입하기</a>
      </span>
    </div>
  </header>

  <main class="auth-shell">

    <section class="auth-form-panel">
      <div class="auth-card">
        <span class="auth-card__eyebrow">로그인</span>
        <h1 class="auth-card__title">다시 만나서 반가워요.</h1>
        <p class="auth-card__sub">아이디 또는 이메일로 로그인.</p>

        <div class="form-banner" role="alert" aria-live="polite"></div>

        <form id="login-form" class="auth-card__form" novalidate>
          <div class="field">
            <label class="field__label" for="login-id">아이디 또는 이메일</label>
            <input class="input" type="text" id="login-id" name="identifier"
                   autocomplete="username" placeholder="아이디 / 이메일"
                   required>
            <small class="field__error"></small>
          </div>

          <div class="field field--password">
            <label class="field__label" for="login-password">비밀번호</label>
            <div class="field__input-wrap">
              <input class="input" type="password" id="login-password" name="password"
                     autocomplete="current-password" placeholder="비밀번호를 입력하세요" required>
              <button type="button" class="password-toggle"
                      aria-label="비밀번호 보기 토글" aria-pressed="false"
                      data-target="#login-password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <small class="field__error"></small>
          </div>

          <div class="auth-card__submit">
            <button type="submit" class="btn btn--lg btn--block">로그인 →</button>
          </div>
        </form>

        <div class="auth-card__divider">또는</div>

        <p class="auth-card__alt">
          처음이신가요? <a href="/signup.html">가입하기</a>
        </p>
      </div>
    </section>

    <aside class="auth-illustration-panel" aria-hidden="true">
      <div class="auth-illustration">
        <span class="auth-illustration__chip auth-illustration__chip--a">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 c0 4 -5 5 -5 10 a5 5 0 0 0 10 0 c0 -2 -2 -3 -3 -5 c0 3 -2 4 -2 4 z" fill="#ff9d3a" stroke="#c46a00"/></svg>
          오늘 스트릭 D-5
        </span>
        <span class="auth-illustration__chip auth-illustration__chip--b">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><polyline points="4 17 10 11 14 15 20 7"/><polyline points="14 7 20 7 20 13"/></svg>
          어제보다 +3 레슨
        </span>
        <span class="auth-illustration__chip auth-illustration__chip--c">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="#ffd14d"/><text x="12" y="16" font-size="11" font-weight="800" text-anchor="middle" fill="#7a5300">₩</text></svg>
          코인 +5
        </span>

        <img src="assets/img/character-base.png" alt="" />
      </div>
    </aside>

  </main>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>

  <!-- 목 -->
  <rect x="184" y="262" width="32" height="40" rx="4"
        fill="#ffeacd" stroke="#b08570" stroke-width="4"/>

  <!-- 머리 -->
  <circle cx="200" cy="170" r="116"
          fill="#ffeacd" stroke="#b08570" stroke-width="5"/>

  <!-- 귀 -->
  <ellipse cx="86" cy="180" rx="14" ry="22"
           fill="#ffeacd" stroke="#b08570" stroke-width="4"/>
  <ellipse cx="314" cy="180" rx="14" ry="22"
           fill="#ffeacd" stroke="#b08570" stroke-width="4"/>

  <!-- 볼터치 -->
  <ellipse cx="118" cy="208" rx="20" ry="14" fill="#ffaac0" opacity="0.5"/>
  <ellipse cx="282" cy="208" rx="20" ry="14" fill="#ffaac0" opacity="0.5"/>

  <!-- 하의: 흰 반바지 -->
  <path d="M152 412 q48 -10 96 0 q-2 26 -8 50 q-18 4 -32 0 q-14 4 -32 0 q-6 -24 -24 -50 z"
        fill="#ffffff" stroke="#777" stroke-width="3" stroke-linejoin="round"/>
  <line x1="200" y1="416" x2="200" y2="460" stroke="#777" stroke-width="2"/>

  <!-- 상의: 흰 탱크탑 -->
  <path d="M156 296 q44 -10 88 0 v140 q-44 12 -88 0 z"
        fill="#ffffff" stroke="#777" stroke-width="3" stroke-linejoin="round"/>
  <path d="M186 296 q14 8 28 0" stroke="#777" stroke-width="3" fill="none"/>

  <!-- 신발: 흰 운동화 -->
  <ellipse cx="184" cy="568" rx="28" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="3"/>
  <ellipse cx="224" cy="568" rx="28" ry="14" fill="#fff" stroke="#1f1f1f" stroke-width="3"/>

  <!-- 표정: 활짝 웃음 -->

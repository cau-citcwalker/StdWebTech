  <path d="M234 140 q14 -6 28 2" stroke="#3a2510" stroke-width="5" stroke-linecap="round" fill="none"/>
  <g data-eye="left">
    <ellipse cx="155" cy="172" rx="11" ry="16" fill="#3a2510"/>
    <circle data-pupil="true" cx="159" cy="166" r="4" fill="#fff"/>
  </g>
  <g data-eye="right">
    <ellipse cx="245" cy="172" rx="11" ry="16" fill="#3a2510"/>

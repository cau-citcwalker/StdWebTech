<?xml version="1.0" encoding="UTF-8"?>
<!--
  도토리 — FinEdu 휴머노이드 마스코트 (기본 아웃핏 차림)
  주의: 이 파일은 <img> 태그용 정적 사본이다.
        실제 사용자 캐릭터는 mascot.js 의 buildMascotSvg() 로 합성된다.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" aria-label="도토리 마스코트">

  <!-- 그림자 -->
  <ellipse cx="200" cy="586" rx="120" ry="9" fill="#000" opacity="0.10"/>

  <!-- 다리 (피부) -->
  <path d="M170 450 q-2 80 -4 110 q14 6 28 0 q-2 -30 -4 -110 z"

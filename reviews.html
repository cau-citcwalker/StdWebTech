<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4154f1" />
  <title>사용자 리뷰 · FinEdu</title>

  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="alternate icon" href="assets/img/favicon.ico" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />

  <script>(function(){try{var t=localStorage.getItem("finedu-theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);else if(matchMedia("(prefers-color-scheme: dark)").matches)document.documentElement.setAttribute("data-theme","dark");}catch(_){}})();</script>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/reviews.css" />
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="/"><span>FinEdu</span></a>
      <button class="site-nav__toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="primary-nav">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
          <line x1="3" y1="7"  x2="21" y2="7"  />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="17" x2="21" y2="17" />
        </svg>
      </button>
      <nav id="primary-nav" class="site-nav" aria-label="주요 메뉴">
        <a class="site-nav__link" href="/">홈</a>
        <a class="site-nav__link" href="/learn.html">학습</a>
        <a class="site-nav__link" href="/terms.html">용어사전</a>
        <a class="site-nav__link" href="/about.html">소개</a>
        <a class="site-nav__link" href="/faq.html">FAQ</a>
        <a class="site-nav__link is-active" href="/reviews.html">리뷰</a>
        <div class="site-nav__actions"></div>
      </nav>
    </div>
  </header>

  <main class="container reviews-shell">

    <!-- 헤드 + 평균 평점 -->
    <header class="reviews-head">
      <span class="reviews-head__eyebrow">⭐ 사용자 리뷰</span>
      <h1 class="reviews-head__title">FinEdu, 어떠셨나요?</h1>
      <div id="reviews-stats" class="reviews-stats"></div>
    </header>

    <!-- 내 리뷰 (있으면 보여주고 / 없으면 작성 폼) -->
    <section id="my-review-section" class="my-review"></section>

    <!-- 정렬 + 별점 필터 -->
    <section class="reviews-toolbar">
      <div class="reviews-toolbar__sort">
        <label for="sort-select">정렬</label>
        <select id="sort-select" class="select">
          <option value="recent">최신순</option>
          <option value="rating_high">별점 높은 순</option>
          <option value="rating_low">별점 낮은 순</option>
        </select>
      </div>
      <div id="filter-chips" class="reviews-toolbar__filter" role="group" aria-label="별점 필터"></div>
    </section>

    <!-- 카운트 + 리스트 -->
    <p id="reviews-count" class="reviews-count" aria-live="polite"></p>
    <section id="reviews-list" class="reviews-list"></section>
    <div id="reviews-pagination"></div>

  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <a class="site-logo" href="/"><span>FinEdu</span></a>
      <p>경제와 금융을 게임처럼 배우는 곳.</p>
      <nav class="site-footer__links" aria-label="페이지 메뉴">
        <a href="/about.html">소개</a>
        <a href="/how-it-works.html">진행 방식</a>
        <a href="/faq.html">FAQ</a>
        <a href="/terms.html">용어사전</a>
      </nav>
      <p class="site-footer__credit">© 2026 FinEdu</p>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/reviews.js"></script>
</body>
</html>

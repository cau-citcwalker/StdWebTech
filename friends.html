<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />

  <meta name="theme-color" content="#58cc02" />
  <title>친구 · FinEdu</title>

  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/friends.css" />

<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-logo" href="/">
        <span class="site-logo__mark" aria-hidden="true">F</span>
        <span>FinEdu</span>
      </a>
      <nav class="site-nav" aria-label="주요 메뉴">

      </nav>

  <main class="container friends-shell">
    <header class="friends-head">
      <h1>친구</h1>
      <p>도토리들끼리 어울려요. 친구의 아이디나 이메일을 입력하면 신청을 보낼 수 있어요.</p>

      <form id="friend-search-form" class="friend-search" novalidate>
        <input id="friend-search-input" class="input" type="text" placeholder="@아이디 또는 이메일" autocomplete="off" />
        <button class="btn btn--sm" type="submit">신청</button>
      </form>
    </header>

    <div id="friends-tabs" class="friends-tabs"></div>
    <div id="friends-list"></div>
  </main>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p class="site-footer__credit">© 2026 FinEdu</p>
    </div>
  </footer>

  <script src="assets/js/site.js"></script>

</html>

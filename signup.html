<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#4154f1" />
  <title>회원가입 · FinEdu</title>

  <link rel="icon" type="image/jpeg" href="assets/img/favicon.jpeg" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/auth.css" />
</head>
<body>

  <header class="auth-header">
    <div class="container auth-header__inner">
      <a class="site-logo" href="/">
                <span>FinEdu</span>
      </a>
      <span class="auth-header__alt">
        이미 계정이 있나요? <a href="/login.html">로그인</a>
      </span>
    </div>
  </header>

  <main class="auth-shell">

    <!-- ============ 폼 ============ -->
    <section class="auth-form-panel">
      <div class="auth-card">
        <span class="auth-card__eyebrow">회원가입</span>
        <h1 class="auth-card__title">무료로 시작해요.</h1>
        <p class="auth-card__sub">이메일과 비밀번호만 있으면 30초면 끝.</p>

        <div class="form-banner" role="alert" aria-live="polite"></div>

        <form id="signup-form" class="auth-card__form" novalidate>
          <div class="field">
            <label class="field__label" for="signup-username">아이디</label>
            <input class="input" type="text" id="signup-username" name="username"
                   autocomplete="username" placeholder="예: kim123"
                   maxlength="40" required>
            <small class="field__hint">영문/숫자/밑줄(_), 3~40자</small>
            <small class="field__error"></small>
          </div>

          <div class="field">
            <label class="field__label" for="signup-display">닉네임</label>
            <input class="input" type="text" id="signup-display" name="display_name"
                   autocomplete="nickname" placeholder="친구들이 부를 이름"
                   maxlength="60">
            <small class="field__hint">학습 화면에서 보이는 이름. 비워두면 아이디로.</small>
            <small class="field__error"></small>
          </div>

          <div class="field">
            <label class="field__label" for="signup-email">이메일</label>
            <input class="input" type="email" id="signup-email" name="email"
                   autocomplete="email" placeholder="you@example.com"
                   required>
            <small class="field__error"></small>
          </div>

          <div class="field field--password">
            <label class="field__label" for="signup-password">비밀번호</label>
            <div class="field__input-wrap">
              <input class="input" type="password" id="signup-password" name="password"
                     autocomplete="new-password" placeholder="8자 이상"
                     minlength="8" required>
              <button type="button" class="password-toggle"
                      aria-label="비밀번호 보기 토글" aria-pressed="false"
                      data-target="#signup-password">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
            <small class="field__error"></small>
          </div>

          <div class="auth-card__submit">
            <button type="submit" class="btn btn--lg btn--block">가입하기 →</button>
          </div>
        </form>

        <div class="auth-card__divider">또는</div>

        <p class="auth-card__alt">
          이미 계정이 있나요? <a href="/login.html">로그인</a>
        </p>
      </div>
    </section>

    <!-- ============ 일러스트 ============ -->
    <aside class="auth-illustration-panel" aria-hidden="true">
      <div class="auth-illustration">
        <span class="auth-illustration__chip auth-illustration__chip--a">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2 14.7 8.6 22 9.3 16.5 14 18.2 21 12 17.3 5.8 21 7.5 14 2 9.3 9.3 8.6Z"/></svg>
          +50 XP 보너스
        </span>
        <span class="auth-illustration__chip auth-illustration__chip--b">
          <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="9" fill="#ffd14d"/><text x="12" y="16" font-size="11" font-weight="800" text-anchor="middle" fill="#7a5300">₩</text></svg>
          가입 즉시 코인
        </span>
        <span class="auth-illustration__chip auth-illustration__chip--c">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          첫 레슨 무료
        </span>

        <img src="assets/img/mascot-dotori.svg" alt="" />
      </div>
    </aside>

  </main>

  <script src="assets/js/site.js"></script>
  <script type="module" src="assets/js/auth.js"></script>
</body>
</html>
